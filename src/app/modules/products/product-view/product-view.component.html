<div class="product-grid-card" *ngIf="product.id">
  <p-card
    class="card-custom"
    [style]="{ overflow: 'hidden', height: '25rem', background: '#ffffff' }"
  >
    <ng-template pTemplate="header">
      <div
        class="relative"
        style="max-width: 8rem; align-items: center; align-content: center"
      >
        <img
          [src]="product.imageUrl || 'assets/images/visores.png'"
          [alt]="product.name"
          class="w-full h-48 object-cover"
        />
        <span class="status-badge">NUEVO</span>
      </div>
    </ng-template>

    <div class="mb-2">
      <span class="text-sm text-500 uppercase font-bold">{{
        product.category
      }}</span>
      <div class="text-xl font-bold text-900 mt-1">{{ product.name }}</div>
    </div>

    <div class="flex align-items-center justify-content-between mb-3">
      <span class="text-2xl font-semibold text-primary">
        {{ product.price | currency: "USD" }}
      </span>
      <p-rating [(ngModel)]="product.rating" [readonly]="true"></p-rating>
    </div>

    <ng-template pTemplate="footer">
      <p-button
        label="Agregar"
        icon="pi pi-cart-plus"
        styleClass="w-full p-button-outlined"
        (click)="addToCart(product.id)"
      >
      </p-button>
    </ng-template>
  </p-card>
</div>
