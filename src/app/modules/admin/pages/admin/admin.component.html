<div class="flex h-screen" *ngIf="!loading">
  <!-- Filtros (20%) -->
<!--  <div class="w-20rem md:w-20rem flex-shrink-0 p-2 border-right-1 surface-border" style="border-right-width: 0px !important; background: red">
    &lt;!&ndash; contenido de filtros &ndash;&gt;



  </div>-->

  <!-- Productos (scrollable) -->
  <div class="flex-1 p-2 ">

    <form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="p-fluid">
      <div class="grid">
        <div class="col-12" style="display: flex; align-items: center;">
          <div class="col-12 md:col-4" style=" display: flex;  flex-direction: column;">
            <label for="name">Nombre</label>
            <input style="height: 40px" pInputText id="name" formControlName="name" />
          </div>

          <div class="col-12 md:col-4" style=" display: flex;  flex-direction: column;">
            <label for="brand">Marca</label>
            <input style="height: 40px" pInputText id="brand" formControlName="brand" />
          </div>

          <div class="col-12 md:col-4" style=" display: flex; flex-direction: column; flex-wrap: wrap; align-content: stretch;">
            <label for="description">Descripción</label>
            <textarea pInputTextarea id="description" rows="3" formControlName="description"></textarea>
          </div>
        </div>

        <div class="col-12" style="display: flex; align-items: center;">
          <div class="col-12 md:col-4" style=" display: flex;  flex-direction: column;">
            <label for="price">Precio</label>
            <p-inputNumber
              id="price"
              formControlName="price"
              mode="currency"
              currency="COP"
              locale="es-CO">
            </p-inputNumber>
          </div>

          <div class="col-12 md:col-4" style=" display: flex;  flex-direction: column;">
            <label for="stock">Stock</label>
            <p-inputNumber id="stock" formControlName="stock"></p-inputNumber>
          </div>


          <div class="col-12 md:col-4">
            <label for="category">Categoría</label>
            <p-select
              id="category"
              [options]="categories"
              optionLabel="label"
              optionValue="value"
              formControlName="category"
              placeholder="Seleccione categoría"
              class="w-full">
            </p-select>
          </div>
        </div>

        <div class="col-12 md:col-6" >
          <p-fileUpload
            name="image"
            mode="basic"
            accept="image/*"
            chooseLabel="Seleccionar imagen"
            (onSelect)="onImageSelect($event)"
            class="w-full">
          </p-fileUpload>
        </div>

      </div>

      <div class="flex justify-content-center gap-2 mt-4 p-button-outlined">
        <p-button
          label="Cancelar"
          severity="secondary"
          (onClick)="onCancel()">
        </p-button>

        <p-button
          label="Guardar"
          type="submit"
          [disabled]="productForm.invalid">
        </p-button>
      </div>

    </form>
    <div class="col-12" style="margin-top: 1em">
      <p-table
        [columns]="columnas" [loading]="loadingTable"
        [value]="listProducts" #dt
        [paginator]="true" [rows]="10"  paginatorPosition="bottom"
      >
        <ng-template pTemplate="header" let-columns>
          <tr>
            <th *ngFor="let col of columns" [pSortableColumn]="col.field"
                [pSortableColumnDisabled]="!col.sort"
                class="text-center">
              {{col.header}}
              <p-sortIcon [field]="col.field" *ngIf="col.sort"></p-sortIcon>
            </th>
          </tr>
        </ng-template>
        <ng-template pTemplate="body" let-row>
          <tr [pSelectableRow]="row">
            <td>{{row.name}}</td>
            <td>{{row.description}}</td>
            <td>{{row.price | currency:'COP':'symbol':'1.0-2':'es-CO'}}</td>
            <td>{{row.category}}</td>
            <td class="text-center">
              <div class="flex justify-content-center gap-2 mt-4 p-button-outlined">
                <p-button
                  label="Inhabilitar"
                  severity="secondary"
                  (onClick)="confirmDisable(row)">
                </p-button>

                <p-button
                  label="Editar"
                  type="submit"
                  (onClick)="edit(row)"
                  >
                </p-button>
              </div>
            </td>
          </tr>
        </ng-template>

      </p-table>
    </div>
  </div>

</div>

<p-toast></p-toast>

<p-confirmDialog></p-confirmDialog>
